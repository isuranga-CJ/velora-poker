name: Deploy poker backend
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: velora-poker-beta-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: https://jmygmgcezbwapbavgime.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_2TtRKc5wo_bcoLlTBT_-DA_hZpvbNjz
      ALLOWED_ORIGINS: https://velora-poker-cj.dewybow7.chatgpt.site
      WORKER_URL: https://velora-poker-beta.chandradasaisuranga.workers.dev
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check deployment credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Add CLOUDFLARE_API_TOKEN in repository Actions secrets.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Add CLOUDFLARE_ACCOUNT_ID in repository Actions secrets.'; exit 1; }
      - name: Deploy the existing poker Worker and SQLite Durable Object
        shell: bash
        run: >-
          npx --yes --package=wrangler@4.92.0 wrangler deploy
          --config workers/wrangler.jsonc
          --var "SUPABASE_URL:$SUPABASE_URL"
          --var "SUPABASE_PUBLISHABLE_KEY:$SUPABASE_PUBLISHABLE_KEY"
          --var "ALLOWED_ORIGINS:$ALLOWED_ORIGINS"
      - name: Check poker service readiness
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const base = process.env.WORKER_URL;
          const deadline = Date.now() + 120000;
          let lastError;
          while (Date.now() < deadline) {
            try {
              for (const path of ['/health', '/ready']) {
                const response = await fetch(`${base}${path}`, {
                  headers: {'Cache-Control': 'no-cache'},
                  signal: AbortSignal.timeout(10000)
                });
                if (!response.ok) throw new Error(`${path} returned ${response.status}`);
                const body = await response.text();
                let data;
                try { data = JSON.parse(body); }
                catch { throw new Error(`${path} has not returned poker JSON yet`); }
                if (data.ready !== true || (path === '/health' && data.service !== 'velora-cloudflare')) {
                  throw new Error(`${path} did not report a ready poker backend`);
                }
              }
              console.log('Poker backend configuration is ready. Real-user authentication and multiplayer still need testing.');
              process.exit(0);
            } catch (error) {
              lastError = error;
              console.log(`Waiting for deployed Worker: ${error.message}`);
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
          }
          throw new Error(`Poker readiness timed out: ${lastError?.message}`);
          JS
